paths:
  tesseract_cmd: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"

extraction:
  supported_formats: [".pdf", ".docx", ".txt", ".jpg", ".jpeg", ".png"]
  ocr_engine: "tesseract" # Options: "tesseract", "florence"
  ocr_dpi: 300
  min_text_length_for_native_pdf: 20

preprocessing:
  spacy_model: "en_core_web_sm"
  min_token_length: 2
  use_lemmatization: true
  use_stemming: false
  custom_stopwords: [
    "exam", "answer", "question", "marks", "page", "student", "test",
    "candidate", "figure", "table", "write", "explain", "describe",
    "outline", "discuss", "points", "grade", "score",
    "master", "prompt", "key"
  ]
  protected_terms: [
    "h2o", "co2", "dna", "rna", "ph", "atp", "mrna", "crispr",
    "api", "sql", "nosql", "aws", "gcp", "tcp", "ip", "http"
  ]
  preserve_numbers: true

similarity:
  method: "semantic"
  semantic_model: "BAAI/bge-large-en-v1.5"
  thresholds:
    excellent: 0.85
    good: 0.65
    poor: 0.40
  tfidf_ngram_range: [1, 2]

llm_reasoning:
  enabled: true
  local_model: "llama3"

question_wise:
  enabled: false
  marker_pattern: "Q(\\d+)[:.)]"

reporting:
  output_dir: "data/outputs"
  top_n_matching_sentences: 3
  chart_dpi: 150
  wordcloud_max_words: 100
